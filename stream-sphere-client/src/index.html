<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>StreamSphere — Watch & Share Videos</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="StreamSphere — discover, watch, and share videos across every category. Stream the best content from creators worldwide.">

  <!-- Preconnect: open connections early for critical third-party origins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Google profile images use no-referrer — omit crossorigin to avoid CORS preflight -->
  <link rel="preconnect" href="https://lh3.googleusercontent.com">

  <!-- Video CDN + API: both are fetched cross-origin by XHR (hls.js / HttpClient),
       so the connection must be opened in anonymous-CORS mode to be reusable.
       Without these the first manifest request pays full DNS+TCP+TLS on the
       critical path, which is pure dead time before any video byte arrives. -->
  <link rel="preconnect" href="https://d3kd63fabw51aq.cloudfront.net" crossorigin>
  <link rel="preconnect" href="https://stream-sphere-azure.vercel.app" crossorigin>

  <!-- Preload the logo WebP so the browser fetches it before rendering the header
       (fixes the 1.4 MB PNG being loaded instead of the 13 KB WebP) -->
  <link rel="preload" href="assets/thumbs/Stream%20Sphere%20Icon.webp" as="image" type="image/webp">

  <!-- Fonts — display=swap keeps text visible during font load.
       Roboto is requested as a weight range (400–700) so 600/700 render as real
       weights instead of synthesized bold; it's the same file Google already
       served. Roboto Mono (player time display) only downloads when used. -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400..700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
  <!-- Material Icons — display=block avoids invisible-icon flash -->
  <!-- Load both baseline + Extended so modern icons (auto_awesome, etc.) render -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Extended&display=block" rel="stylesheet">
</head>
<body class="mat-typography">
  <app-root></app-root>
</body>
</html>
