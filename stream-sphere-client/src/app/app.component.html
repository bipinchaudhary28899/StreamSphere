<app-header></app-header>

<main class="main-body" [class.home-page]="isHomePage" [class.has-bottom-nav]="isLoggedIn">
  <router-outlet></router-outlet>
</main>

<!-- Mobile bottom navigation (logged-in only) -->
<nav class="mobile-bottom-nav" *ngIf="isLoggedIn" aria-label="Main">
  <a routerLink="/home"
     routerLinkActive="active"
     [routerLinkActiveOptions]="{exact: false}"
     #homeLink="routerLinkActive"
     [attr.aria-current]="homeLink.isActive ? 'page' : null"
     class="nav-item">
    <span class="nav-icon"><mat-icon>home</mat-icon></span>
    <span class="nav-label">Home</span>
  </a>
  <a routerLink="/history"
     routerLinkActive="active"
     #historyLink="routerLinkActive"
     [attr.aria-current]="historyLink.isActive ? 'page' : null"
     class="nav-item">
    <span class="nav-icon"><mat-icon>history</mat-icon></span>
    <span class="nav-label">History</span>
  </a>
  <a routerLink="/upload"
     routerLinkActive="active"
     #uploadLink="routerLinkActive"
     [attr.aria-current]="uploadLink.isActive ? 'page' : null"
     class="nav-item nav-item--create"
     aria-label="Upload a video">
    <span class="nav-icon"><mat-icon>add</mat-icon></span>
    <span class="nav-label">Upload</span>
  </a>
  <a routerLink="/user-profile"
     routerLinkActive="active"
     #profileLink="routerLinkActive"
     [attr.aria-current]="profileLink.isActive ? 'page' : null"
     class="nav-item">
    <span class="nav-icon"><mat-icon>account_circle</mat-icon></span>
    <span class="nav-label">You</span>
  </a>
</nav>
